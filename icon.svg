  <circle cx="256" cy="186" r="82" fill="#F2B134"/>
  <path d="M0 322c64-38 128-38 192 0s128 38 192 0 64-26 128 0v190H0Z" fill="#1F5F8B"/>
  <path d="M0 394c64-38 128-38 192 0s128 38 192 0 64-26 128 0v118H0Z" fill="#3E86B8"/>

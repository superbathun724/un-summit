<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="YOUTH LEADER">
  <!-- Original artwork, same palette as the app: no logo, no licensed mark, nothing to clear.
       Readable at 16px, so it is three shapes and nothing else: the sky, the sun the smog
       is cleared off, and the water it all comes down to. Content sits inside the middle
       80% so Android can mask it into a circle without cropping the sun. -->
